<html>
  <head>
    <authsignal-head></authsignal-head>
    <style>
      :root {
        --tonal: #d3e3fd;
        --on-tonal: #0b57d0;
        --state: rgba(11, 87, 208, 0.08);
        --chip: #c4eed0;
        --on-chip: #0f5223;
        --outline: #747775;
        --menu: #f3f6fc;
      }
      :root.dark {
        --tonal: #004a77;
        --on-tonal: #c2e7ff;
        --state: rgba(168, 199, 250, 0.1);
        --chip: #0f5223;
        --on-chip: #c4eed0;
        --outline: #8e918f;
        --menu: #282a2c;
      }

      /* Custom templates don't paint the page itself, so fill it with the theme's page color */
      html,
      body {
        min-height: 100%;
        background-color: var(--page-background-color);
      }

      /* Four-color bar across the top of the card */
      #widget-container {
        overflow: hidden;
      }
      #widget-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #4285f4 0 25%, #ea4335 25% 50%, #fbbc04 50% 75%, #34a853 75%);
      }

      /* Material 3 type: regular-weight headline, medium-weight labels */
      #widget-container h1 {
        font-weight: 400;
        font-size: 2.25rem;
        line-height: 2.75rem;
        letter-spacing: 0;
        margin-top: 8px;
      }
      #widget-container main > p,
      #widget-container form > p {
        color: var(--heading-text-color);
      }

      /* Two columns on wide screens, like the current Google sign-in page */
      @media (min-width: 900px) {
        div:has(> #widget-container),
        #widget-container {
          max-width: 1040px !important;
          width: 1040px;
        }
        #widget-container main {
          display: grid;
          grid-template-columns: 1fr 1fr;
          column-gap: 48px;
          row-gap: 20px;
          align-items: start;
        }
        #widget-container main > * {
          grid-column: 2;
        }
        #widget-container main > h1 {
          grid-column: 1;
          grid-row: 1;
        }
        #widget-container main > h1 + p {
          grid-column: 1;
          grid-row: 2;
        }
        #widget-container main > ul,
        #widget-container main > form {
          grid-row: 1 / span 3;
        }
        #widget-container main > h1 + p + ul {
          grid-row: 1 / span 3;
        }
      }

      /* Methods as a Material 3 list with tonal icons */
      #widget-container ul {
        gap: 0;
        border: 1px solid var(--card-border-color);
        border-radius: 16px;
        overflow: hidden;
      }
      #widget-container ul li + li {
        border-top: 1px solid var(--card-border-color);
      }
      #widget-container .card-shadow,
      #widget-container .card-shadow > div,
      #widget-container ul a {
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      #widget-container .card-shadow > div {
        padding: 14px 16px;
        transition: background-color 0.15s;
      }
      #widget-container a:hover .card-shadow > div {
        background: var(--state) !important;
      }
      #widget-container .card-shadow > div > div {
        gap: 16px;
      }
      /* The icons have no viewBox, so they can't be resized: keep them at 40px
         and grow the tonal circle behind them with a spread shadow instead */
      #widget-container .card-shadow > div > div > svg {
        margin: 4px;
        border-radius: 50%;
        background: var(--tonal);
        box-shadow: 0 0 0 4px var(--tonal);
        color: var(--on-tonal) !important;
        --icon-color: var(--on-tonal);
      }
      #widget-container .card-shadow > div > div > div > :first-child {
        font-size: 1rem;
        font-weight: 500;
        color: var(--heading-text-color);
      }
      #widget-container .card-shadow > div > div > div > :last-child {
        font-size: 0.875rem;
      }
      #widget-container li span.rounded-b-lg {
        top: 12px !important;
        right: 48px !important;
        padding: 2px 10px;
        border-radius: 8px !important;
        background: var(--chip) !important;
        color: var(--on-chip) !important;
        font-weight: 500;
      }

      /* Outlined text fields */
      #widget-container input {
        height: 56px;
        border-color: var(--outline) !important;
        font-size: 1rem;
      }
      #widget-container input:hover {
        border-color: var(--heading-text-color) !important;
      }
      #widget-container input:focus {
        outline: none;
        border-color: var(--focus-color) !important;
        box-shadow: inset 0 0 0 1px var(--focus-color);
      }
      #widget-container button[aria-haspopup="listbox"] {
        border: none !important;
        background: transparent !important;
        margin-left: 4px;
      }
      #widget-container div:has(> [role="listbox"]) {
        background: var(--menu) !important;
        border: none !important;
        border-radius: 4px !important;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
      }
      #widget-container [role="option"] {
        margin: 0 !important;
        padding: 12px 16px !important;
        border-radius: 0 !important;
      }
      #widget-container [role="option"]:hover,
      #widget-container [role="option"]:focus {
        background: var(--state) !important;
      }

      /* Filled pill button, right-aligned like "Next" */
      #widget-container form > span.control-shadow {
        width: auto;
        flex: none;
        align-self: flex-end;
      }
      .Button {
        flex: none;
        height: 40px;
        padding: 0 24px;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition: background-color 0.2s, box-shadow 0.2s;
      }
      .Button--primary:hover {
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
      }

      /* Text buttons and links */
      #widget-container a.text-link,
      #widget-container .HeaderBandSide button {
        font-weight: 500;
        text-decoration: none;
      }
      #widget-container .HeaderBandSide button {
        padding: 8px 12px;
        border-radius: 20px;
      }
      #widget-container .HeaderBandSide button:hover {
        background: var(--state);
      }

      /* Four bouncing dots instead of a spinner */
      .Spinner--large {
        border: none !important;
        animation: none !important;
        width: 72px !important;
        height: 24px !important;
        position: relative;
      }
      .Spinner--large::before {
        content: "";
        position: absolute;
        left: 0;
        top: 6px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #4285f4;
        box-shadow: 20px 0 #ea4335, 40px 0 #fbbc04, 60px 0 #34a853;
        animation: dots 0.9s ease-in-out infinite alternate;
      }
      @keyframes dots {
        from { transform: translateY(-5px); }
        to { transform: translateY(5px); }
      }
    </style>
  </head>
  <body>
    <authsignal-widget></authsignal-widget>
  </body>
</html>
